name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tag and source tree
        run: |
          npm run validate:release -- "$GITHUB_REF_NAME"
          git diff --check

      - name: Run release checks and production build
        run: npm run ci

      - name: Stage exact release assets
        run: |
          mkdir release
          cp main.js manifest.json styles.css release/
          npm run validate:bundle -- release
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Reject duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: '! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"'

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/main.js release/manifest.json release/styles.css
